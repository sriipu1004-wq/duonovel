name: Child71 Public Domain ingestion checks

on:
  pull_request:
    paths:
      - ".github/workflows/child71-public-domain-check.yml"
      - "public-domain/**"
      - "docs/public-domain-ingestion.md"
      - "scripts/public-domain/**"
      - "scripts/test-public-domain-ingestion.ts"
      - "scripts/test-public-classic-translation.ts"
      - "src/lib/translation/episodeTranslationGenerateLimits.ts"
      - "src/lib/translation/prepareEpisodeTranslationGeneration.ts"
      - "src/lib/publicDomainMetadata.ts"
      - "src/lib/publicWorks.ts"
      - "src/i18n/dictionaries/work.ts"
      - "src/app/works/[seriesId]/page.tsx"
      - "src/app/locale-work/[seriesId]/page.tsx"
      - "src/app/write/page.tsx"
      - "src/features/write/WriteSeriesForm.tsx"
      - "src/features/works/WorkTranslationAvailability.tsx"
      - "src/components/search/PublicSearchControls.tsx"
      - "src/app/search/SearchPageLegacy.tsx"
      - "src/features/playback/WebSpeechEpisodePlayback.tsx"
      - "src/lib/recording/humanTimingShared.ts"
      - "src/lib/translation/segmentSourceDocument.ts"
      - "src/i18n/tagLabels.ts"
      - "src/i18n/genreLabels.ts"
      - "src/i18n/AuthoringGenreLocalePortal.tsx"
      - "src/i18n/UiLocaleProvider.tsx"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate committed Public Domain manifests
        run: npm run public-domain:validate

      - name: Public Domain ingestion regression
        run: npm run test:public-domain-ingestion

      - name: Child65-70 regression
        run: |
          npm run test:security-authz
          npm run test:reader-mode-unification
          npm run test:public-classic-translation
          npm run test:series-translation-permission-schema
          npm run test:public-search-language-filters
          npm run test:en-ko-i18n
          npm run test:pricing-copy
          npm run test:human-recording-state
          npm run test:human-recording-boundaries
          npm run test:author-workspace-ux

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-scope ESLint
        run: >
          npx eslint
          scripts/public-domain/core.ts
          scripts/public-domain/aozora.ts
          scripts/public-domain/aozora-candidates.ts
          scripts/public-domain/source-sync.ts
          scripts/public-domain/gongu.ts
          scripts/public-domain/generate-parity-manifests.ts
          scripts/public-domain/report-parity-preflight.ts
          scripts/public-domain/batch.ts
          scripts/public-domain/audit-official.ts
          scripts/public-domain/runtime.ts
          scripts/public-domain/validate.ts
          scripts/public-domain/prepare.ts
          scripts/public-domain/import.ts
          scripts/test-public-domain-ingestion.ts
          scripts/test-public-classic-translation.ts
          src/lib/translation/episodeTranslationGenerateLimits.ts
          src/lib/translation/prepareEpisodeTranslationGeneration.ts
          src/lib/publicDomainMetadata.ts
          src/lib/publicWorks.ts
          src/i18n/dictionaries/work.ts
          src/app/works/[seriesId]/page.tsx
          src/app/locale-work/[seriesId]/page.tsx
          src/app/write/page.tsx
          src/features/works/WorkTranslationAvailability.tsx
          src/features/playback/WebSpeechEpisodePlayback.tsx
          src/lib/recording/humanTimingShared.ts
          src/lib/translation/segmentSourceDocument.ts
          src/i18n/tagLabels.ts
          src/i18n/genreLabels.ts
          src/i18n/AuthoringGenreLocalePortal.tsx
          src/i18n/UiLocaleProvider.tsx

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
