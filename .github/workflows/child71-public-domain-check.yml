name: Child71 Public Domain ingestion checks

on:
  pull_request:
    paths:
      - ".github/workflows/child71-public-domain-check.yml"
      - "public-domain/**"
      - "docs/public-domain-ingestion.md"
      - "scripts/public-domain/**"
      - "scripts/test-public-domain-ingestion.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public Domain ingestion regression
        run: npm run test:public-domain-ingestion

      - name: Aozora live catalog diagnostic
        run: npm run public-domain:aozora-candidates -- --limit=3 --diagnose

      - name: Child65-70 regression
        run: |
          npm run test:security-authz
          npm run test:reader-mode-unification
          npm run test:public-classic-translation
          npm run test:series-translation-permission-schema
          npm run test:public-search-language-filters
          npm run test:en-ko-i18n
          npm run test:pricing-copy
          npm run test:human-recording-state
          npm run test:human-recording-boundaries
          npm run test:author-workspace-ux

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-scope ESLint
        run: >
          npx eslint
          scripts/public-domain/core.ts
          scripts/public-domain/aozora.ts
          scripts/public-domain/aozora-candidates.ts
          scripts/public-domain/source-sync.ts
          scripts/public-domain/batch.ts
          scripts/public-domain/audit-official.ts
          scripts/public-domain/runtime.ts
          scripts/public-domain/validate.ts
          scripts/public-domain/prepare.ts
          scripts/public-domain/import.ts
          scripts/test-public-domain-ingestion.ts

      # The repository's Next.js build needs Preview Supabase environment values.
      # Vercel's GitHub integration runs npm run build for every PR/head commit and
      # is the build gate; duplicating it here without secrets would fail while
      # collecting existing app page data before reaching Child71 code.
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
