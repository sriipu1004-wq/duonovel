name: Child84 public read reliability checks

on:
  pull_request:
    paths:
      - ".github/workflows/child84-public-read-reliability-check.yml"
      - "package.json"
      - "scripts/test-public-read-reliability-performance.ts"
      - "scripts/test-scheduled-episode-release-contract.ts"
      - "scripts/test-scheduled-episode-release-postgres.sh"
      - "supabase/migrations/20261010230000_child84_scheduled_episode_db_release.sql"
      - "scripts/test-owned-series-server-save.ts"
      - "src/app/actions/**"
      - "src/lib/write/**"
      - "src/features/write/WriteSeriesForm.tsx"
      - "scripts/test-public-fetch-timeout-diagnostics.ts"
      - "src/app/PublicTopPageLegacy.tsx"
      - "src/app/ranking/**"
      - "src/app/read/**"
      - "src/app/search/**"
      - "src/app/sitemap.ts"
      - "src/app/works/**"
      - "src/components/auth/AuthStatus.tsx"
      - "src/features/works/WorkTranslationAvailability.tsx"
      - "src/lib/auth/authSessionState.ts"
      - "src/lib/publicRead.ts"
      - "src/lib/publicWorks.ts"
      - "src/lib/reliability/**"
      - "src/lib/supabase/serverPublic.ts"
      - "src/lib/translation/publicWorkTranslations.ts"
      - "scripts/test-owned-series-create.ts"
      - "scripts/test-owned-episode-server-save.ts"
      - "scripts/test-series-route-cache-invalidation.ts"
      - "scripts/test-child84-visibility-gates.ts"
      - "scripts/test-ai-permission-cache-coherence.ts"
      - "src/app/api/series/**"
      - "src/features/write/TranslationPermissionWorkspaceBridge.tsx"
      - "src/features/write/PendingTranslationPermissionBridge.tsx"
      - "src/features/write/WriteEpisodeForm.tsx"
      - "src/features/write/SourceLanguageWorkspaceBridge.tsx"
      - "src/features/write/ContentRatingWorkspaceBridge.tsx"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Child84 reliability regression
        run: npm run test:public-read-reliability-performance

      - name: Public read HTTP deadline behavior (no network)
        run: npm run test:public-fetch-timeout-diagnostics

      - name: Owner publication mutation and cache-integrity regressions
        run: |
          npm run test:owned-series-server-save
          npm run test:owned-series-create
          npm run test:owned-episode-server-save
          npm run test:series-route-cache-invalidation
          npm run test:child84-visibility-gates
          npm run test:ai-permission-cache-coherence

      - name: Scheduled release source/visibility contract (no DB writes)
        run: npm run test:scheduled-episode-release-contract

      - name: Reader and translation regressions
        run: |
          npm run test:reader-mode-unification
          npm run test:multilingual-work-reader
          npm run test:human-translation
          npm run test:series-translation-permission-schema
          npm run test:translation-credit-runtime

      - name: Security regression
        run: npm run test:security-authz

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-scope ESLint
        run: >
          npx eslint
          scripts/test-public-read-reliability-performance.ts
          scripts/test-scheduled-episode-release-contract.ts
          scripts/test-public-fetch-timeout-diagnostics.ts
          scripts/test-owned-series-server-save.ts
          src/app/actions/saveOwnedSeriesWorkspace.ts
          src/lib/write/ownedSeriesPayload.ts
          src/features/write/WriteSeriesForm.tsx
          src/app/read/[seriesId]/[episodeNumber]/layout.tsx
          src/app/read/[seriesId]/[episodeNumber]/page.tsx
          src/lib/publicRead.ts
          scripts/test-owned-series-create.ts
          scripts/test-owned-episode-server-save.ts
          scripts/test-series-route-cache-invalidation.ts
          scripts/test-child84-visibility-gates.ts
          scripts/test-ai-permission-cache-coherence.ts
          src/app/api/series/[seriesId]/translation-permission/route.ts
          src/features/write/TranslationPermissionWorkspaceBridge.tsx
          src/features/write/PendingTranslationPermissionBridge.tsx
          src/app/actions/createOwnedSeries.ts
          src/app/actions/saveOwnedEpisode.ts
          src/lib/write/ownedEpisodePayload.ts
          src/features/write/WriteEpisodeForm.tsx
          src/app/api/series/[seriesId]/source-language/route.ts
          src/app/api/series/[seriesId]/content-rating/route.ts
          src/features/write/SourceLanguageWorkspaceBridge.tsx
          src/features/write/ContentRatingWorkspaceBridge.tsx
          src/features/write/WriteSeriesCreateForm.tsx

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

  scheduled-postgres-sql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: child84_validation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: child84-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d child84_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute actual Cron SQL in ephemeral PostgreSQL 17
        env:
          CHILD84_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-scheduled-episode-release-postgres.sh
