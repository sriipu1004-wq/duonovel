name: Author workspace UX validation

on:
  push:
    branches:
      - fix/author-workspace-ux-cleanup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Author workspace UX regression
        run: npm run test:author-workspace-ux

      - name: Workspace schema regression
        run: npm run test:workspace-schema-queries

      - name: EN KO i18n regression
        run: npm run test:en-ko-i18n

      - name: Translation permission regression
        run: npm run test:series-translation-permission-schema

      - name: Translation consistency regression
        run: npm run test:translation-consistency

      - name: Auth redirect regression
        run: npm run test:auth-login-redirect

      - name: Authorization regression
        run: npm run test:security-authz

      - name: Pricing wording regression
        run: npm run test:pricing-copy

      - name: Reader regression
        run: npm run test:reader-mode-unification

      - name: Official classic translation regression
        run: npm run test:public-classic-translation

      - name: Human narration state regression
        run: npm run test:human-recording-state

      - name: Human narration boundary regression
        run: npm run test:human-recording-boundaries

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-scope ESLint
        run: >-
          npx eslint
          src/app/write/series/new/page.tsx
          src/features/write/SeriesStatusPortal.tsx
          src/features/write/SourceLanguageWorkspaceBridge.tsx
          src/features/write/WriteSeriesForm.tsx
          src/features/write/WriteEpisodeForm.tsx
          src/features/write/TranslationPermissionWorkspaceBridge.tsx
          src/features/write/ContentRatingWorkspaceBridge.tsx
          src/i18n/AuthoringUiLocaleBridge.tsx
          scripts/test-author-workspace-ux.ts

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: npm run build
