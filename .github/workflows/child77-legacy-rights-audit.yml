name: Child77 legacy Official provenance audit

on:
  push:
    branches:
      - audit/legacy-official-rights-provenance
    paths:
      - ".github/workflows/child77-legacy-rights-audit.yml"
      - "scripts/public-domain/legacy-provenance-audit.ts"
      - "public-domain/audits/legacy-official-production-fingerprints-2026-09-25.json"
      - "public-domain/audits/legacy-official-rights-classification-2026-09-25.json"
      - "public-domain/manifests/aozora-000753.json"
      - "scripts/public-domain/migrate-legacy-approved.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child77-legacy-rights-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/legacy-official-rights-provenance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate irreversible Production fingerprints
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "public-domain/audits/legacy-official-production-fingerprints-2026-09-25.json";
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          if (report.mode !== "READ_ONLY_HASH_FINGERPRINTS") throw new Error("unexpected fingerprint mode");
          if (report.body_included !== false) throw new Error("body_included invariant failed");
          if (report.legacy_count !== 37 || report.series.length !== 37) throw new Error("legacy count drift");
          const serialized = JSON.stringify(report);
          if (serialized.includes('"body":')) throw new Error("raw Production body leaked into fingerprint report");
          console.log({
            legacy_count: report.legacy_count,
            episodes: report.series.reduce((sum, item) => sum + item.episode_count, 0),
            oversized_series: report.series.filter((item) => item.oversized_episode_count > 0).length,
          });
          NODE

      - name: Recover exact Aozora provenance from fingerprints
        run: npx tsx scripts/public-domain/legacy-provenance-audit.ts

      - name: Verify provenance snapshot contains no raw bodies
        shell: bash
        run: |
          test -f public-domain/audits/legacy-official-provenance-recovery-2026-09-25.json
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("public-domain/audits/legacy-official-provenance-recovery-2026-09-25.json", "utf8"));
          if (report.summary.legacy_series !== 37) throw new Error("legacy count drift");
          if (report.production_body_exported !== false) throw new Error("body export invariant failed");
          const serialized = JSON.stringify(report);
          if (serialized.includes('"body":')) throw new Error("raw Production body leaked into provenance report");
          console.log(report.summary);
          NODE

      - name: Validate Public Domain manifests
        run: npm run public-domain:validate

      - name: Dry-run approved legacy migration against live Production identity
        run: npm run public-domain:migrate-legacy-approved

      - name: Public Domain regression
        run: npm run test:public-domain-ingestion

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Persist read-only evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-domain/audits/legacy-official-provenance-recovery-2026-09-25.json
          if git diff --cached --quiet; then
            echo "No audit snapshot change"
          else
            git commit -m "Child77: persist legacy provenance recovery snapshot"
            git push origin HEAD:audit/legacy-official-rights-provenance
          fi
