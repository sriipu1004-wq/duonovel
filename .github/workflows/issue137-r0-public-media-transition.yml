      - "scripts/issue137-b2/r0-h2-browser-positive.mjs"
      - "scripts/issue137-b2/r0-h2-browser-interrupt.mjs"
      - "scripts/issue137-b2/r0-h2-legacy-signed-path-local-e2e.mjs"
      - "scripts/issue137-b2/r0-h2-active-expired-token-local-e2e.mjs"
      - "scripts/issue137-b2/r0-b2-h1-render-single-local.mjs"
      - "scripts/issue137-b2/r0-h1-atomic-local-extension.sql"
      - "scripts/issue137-b2/r0-h2-signed-staging-lease-extension.sql"
