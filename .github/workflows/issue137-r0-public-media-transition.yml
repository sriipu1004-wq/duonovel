      - "src/app/api/recordings/human-upload-abort/route.ts"
      - "src/components/recording/RecordingStudioPage.tsx"
      - "docs/issue137-h2-human-temp-staging-leases.md"
      - "src/lib/recording/humanStagingLease.ts"
      - "src/app/api/recordings/human-upload-session/route.ts"
      - "src/app/api/recordings/human-upload-finalize/route.ts"
      - "scripts/issue137-b2/r0-h1-atomic-local-e2e.mjs"
      - "scripts/issue137-b2/r0-hosted-constraint-overlay-local.sql"
      - "scripts/issue137-b2/r0-forward-repair-rehearsal-local.sql"
      - "scripts/issue137-b2/r0-privileged-s3-local-e2e.mjs"
      - "scripts/issue137-b2/r0-direct-service-role-storage-local.sql"
      - "scripts/issue137-b2/r0-signed-upload-revocation-local-e2e.mjs"
      - "scripts/issue137-b2/r0-legacy-human-orphans-readonly.sql"
      - "docs/issue137-legacy-human-orphan-rights-readonly.md"
      - "src/lib/recording/humanRecordingAtomic.ts"
      - "src/app/actions/saveOwnedSeriesWorkspace.ts"
      - "src/features/write/WriteSeriesForm.tsx"
      - "scripts/issue137-b2/r0-run-local-storage.sh"
      - "src/app/api/series/[seriesId]/content-rating/route.ts"
      - "src/app/works/[seriesId]/page.tsx"
      - "src/lib/publicWorks.ts"
      - "src/lib/publicRead.ts"
      - "src/lib/recording/**"
      - "src/app/api/recordings/ai-audio/**"
      - "src/app/api/recordings/human-audio/**"
      - "src/app/read/**"
      - "src/lib/publicCatalogEpochFence.ts"
      - "scripts/test-issue137-work-metadata-visibility.ts"
      - "scripts/test-public-search-language-filters.ts"
      - "docs/issue137-r18-reader-catalog-integration-slice.md"
      - ".github/workflows/issue137-r0-public-media-transition.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres17-synthetic-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify public-media candidate using synthetic PostgreSQL 17 fixture
        env:
          PGPASSWORD: local-fixture-only
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          DO_NOT_CONTACT_PRODUCTION: "true"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DO_NOT_CONTACT_PRODUCTION}" != "true" ]; then exit 1; fi
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          psql -X -v ON_ERROR_STOP=1 -f scripts/issue137-b2/r0-public-media-transition-local-test.sql
      - name: Verify 55 legacy-source snapshot and unsafe migration filename HOLD
        env:
          DO_NOT_CONTACT_PRODUCTION: "true"
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/issue137-b2/r0-legacy-history-preflight.mjs
          node scripts/issue137-b2/r0-legacy-history-preflight.mjs --self-test
          node --check scripts/issue137-b2/r0-current-schema-release-source.test.mjs
          node scripts/issue137-b2/r0-current-schema-release-source.test.mjs
          node scripts/issue137-b2/r0-legacy-history-preflight.mjs --emit-readonly-sql > /tmp/issue137-legacy-catalog-preflight.sql
          grep -Fq 'BEGIN READ ONLY;' /tmp/issue137-legacy-catalog-preflight.sql
          grep -Fq 'ROLLBACK;' /tmp/issue137-legacy-catalog-preflight.sql
          grep -Fq 'BEGIN READ ONLY;' scripts/issue137-b2/r0-hosted-target-schema-readonly.sql
          grep -Fq 'ROLLBACK;' scripts/issue137-b2/r0-hosted-target-schema-readonly.sql
          grep -Fq "'public','recordings','reader_id','uuid','NO'" scripts/issue137-b2/r0-hosted-target-schema-readonly.sql
          grep -Fq "'public','recordings','voice_model_id','uuid','YES'" scripts/issue137-b2/r0-hosted-target-schema-readonly.sql
          grep -Fq "reader_id uuid not null" scripts/issue137-b2/r0-local-storage-fixture.sql
          grep -Fq "voice_model_id uuid" scripts/issue137-b2/r0-local-storage-fixture.sql
          echo "PASS: legacy preflight generated READ-ONLY SQL without accessing hosted database"
      - name: Diff whitespace check
        run: git diff --check

  local-supabase-storage-auth-e2e:
    # Public same-repo PR only. Forked/untrusted PR code must NEVER run Docker E2E
    # with runner credentials; no hosted secrets are supplied to this job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.private == false &&
      github.event.pull_request.number == 160 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue137-r18-public-media-transition-minimal'
    needs: postgres17-synthetic-negative
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DO_NOT_CONTACT_PRODUCTION: 'true'
      R0_OWNER_UI_BROWSER: 'enabled'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate disposable-only script guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/issue137-b2/r0-run-local-storage.sh
          node --check scripts/issue137-b2/r0-local-storage-e2e.mjs
          node --check scripts/issue137-b2/r0-batch-retirement-local-e2e.mjs
          node --check scripts/issue137-b2/r0-b2-auth-storage-negative-e2e.mjs
          node --check scripts/issue137-b2/r0-next-http-e2e.mjs
          node --check scripts/issue137-b2/r0-h2-browser-runner.mjs
          node --check scripts/issue137-b2/r0-h2-browser-positive.mjs
          node --check scripts/issue137-b2/r0-h2-browser-interrupt.mjs
          node --check scripts/issue137-b2/r0-h2-legacy-signed-path-local-e2e.mjs
          node --check scripts/issue137-b2/r0-h2-active-expired-token-local-e2e.mjs
          node --check scripts/issue137-b2/r0-b2-h1-render-single-local.mjs
          grep -Fq "ISSUE137_LOCAL_FORWARD_REPAIR_SECURITY_PRESERVED" scripts/issue137-b2/r0-forward-repair-rehearsal-local.sql
          grep -Fq "series_author_id_fkey" scripts/issue137-b2/r0-hosted-constraint-overlay-local.sql
          grep -Fq "recordings_voice_model_id_fkey" scripts/issue137-b2/r0-hosted-constraint-overlay-local.sql
          node --check scripts/issue137-b2/r0-h1-atomic-local-e2e.mjs
          node --check scripts/issue137-b2/r0-privileged-s3-local-e2e.mjs
          node --check scripts/issue137-b2/r0-signed-upload-revocation-local-e2e.mjs
          node --check scripts/issue137-b2/r0-h2-local-retirement-e2e.mjs
          node scripts/issue137-b2/h2-stage-lifecycle-source.test.mjs
          grep -Fq "ISSUE137_H2_DISPOSABLE_EXPIRY_SIMULATED" scripts/issue137-b2/r0-h2-local-advance-expiry-only.sql
          grep -Fq "issue137_h2_stage_finish_retirement" scripts/issue137-b2/r0-h2-signed-staging-lease-extension.sql
          grep -Fq "issue137_h2_stage_storage_guard" scripts/issue137-b2/r0-h2-signed-staging-lease-extension.sql
          grep -Fq "H2_STAGE_LEASE_REVOKED" scripts/issue137-b2/r0-h2-signed-staging-lease-extension.sql
          grep -Fq "set local role service_role;" scripts/issue137-b2/r0-direct-service-role-storage-local.sql
          grep -Fq "rollback;" scripts/issue137-b2/r0-direct-service-role-storage-local.sql
          grep -Fq "ISSUE137_DIRECT_SQL_ROLE_BOUNDARY_AND_ROLLBACK_PASS" scripts/issue137-b2/r0-direct-service-role-storage-local.sql
          grep -Fq 'begin read only;' scripts/issue137-b2/r0-legacy-human-orphans-readonly.sql
          grep -Fq 'rollback;' scripts/issue137-b2/r0-legacy-human-orphans-readonly.sql
          grep -Fq 'RIGHTS_AND_CONSENT_UNPROVEN_NO_PUBLICATION_NO_DELETION' scripts/issue137-b2/r0-legacy-human-orphans-readonly.sql
          node scripts/issue137-b2/r0-b2-h1-render-single-local.mjs --self-test
          docker info >/dev/null
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
      - name: Install exact locked app SDK for REAL LOCAL Storage HTTP
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install temporary pinned Chromium test runner (non-shipped, no lockfile mutation)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node -e "require('playwright').chromium || process.exit(1)"
      - name: Exercise genuine AI writer CAS, Human owner fence and preview publication guard (isolated SOURCE)
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/issue137-b2/generator-recording-ownership.test.ts
          node --import tsx scripts/issue137-b2/public-media-writer-bridge.test.ts
      - name: Disposable CLI, Storage 3-object retirement/recovery, Auth/R18/Next HTTP and rollback E2E
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/issue137-b2/r0-run-local-storage.sh
          echo "PASS: real LOCAL-only Storage and Next HTTP positive/negative checks completed"
