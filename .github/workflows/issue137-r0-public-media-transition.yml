# No Production or Supabase secrets; NEVER perform migration deployment here.
name: Issue137 minimal public media transition SQL (isolated)
on:
  pull_request:
    paths:
      - "scripts/issue137-b2/r0-public-media-transition-candidate.sql"
      - "scripts/issue137-b2/r0-b2-unified-local-candidate.sql"
      - "scripts/issue137-b2/r0-public-media-transition-local-test.sql"
      - "scripts/issue137-b2/r0-legacy-history-preflight.mjs"
      - "scripts/issue137-b2/r0-high-risk-live-semantic-readonly.sql"
      - "scripts/issue137-b2/r0-hosted-target-schema-readonly.sql"
      - "docs/issue137-b2-r0-migration-rollout-rollback.md"
      - "docs/issue137-r0-emergency-public-media-retirement.md"
      - "scripts/issue137-b2/r0-current-schema-release-source.test.mjs"
      - "scripts/issue137-b2/r0-legacy-catalog-probes.json"
