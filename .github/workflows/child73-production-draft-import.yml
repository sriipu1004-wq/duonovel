name: Child73 Production Draft import

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type IMPORT_75_DRAFTS to acquire, dry-run, and import the approved EN/KO cohort as private Drafts"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: child73-production-draft-import
  cancel-in-progress: false

jobs:
  import-drafts:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'IMPORT_75_DRAFTS'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLIC_DOMAIN_IMPORT_TARGET: production
      PUBLIC_DOMAIN_IMPORT_CONFIRM: PRODUCTION_DRAFT_ONLY
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate approved manifests
        run: npm run public-domain:validate

      - name: Resolve parity IDs
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const batch = require("./public-domain/batches/en-ko-parity-2026-09-23.json");
          const format = (entry) => {
            const prefix = entry.provider === "gutenberg" ? "gutenberg" : "gongu";
            const id = entry.provider === "gutenberg"
              ? String(entry.provider_id).padStart(6, "0")
              : String(entry.provider_id);
            return prefix + "-" + id;
          };
          const en = batch.works.filter((entry) => entry.provider === "gutenberg").map(format);
          const ko = batch.works.filter((entry) => entry.provider === "gongu").map(format);
          if (en.length !== 38 || ko.length !== 37 || en.length + ko.length !== 75) {
            throw new Error(`Parity ID count mismatch: en=${en.length} ko=${ko.length}`);
          }
          fs.writeFileSync("/tmp/child73-en-ids.txt", en.join("\n") + "\n");
          fs.writeFileSync("/tmp/child73-ko-ids.txt", ko.join("\n") + "\n");
          fs.writeFileSync("/tmp/child73-ids.txt", [...en, ...ko].join("\n") + "\n");
          NODE
          test "$(wc -l < /tmp/child73-ids.txt | tr -d ' ')" = "75"

      - name: Acquire and prepare exact approved English sources
        shell: bash
        run: |
          mapfile -t IDS < /tmp/child73-en-ids.txt
          npm run public-domain:source-sync -- "${IDS[@]}" --prepare --limit=50 --delay-ms=750

      - name: Acquire and prepare exact approved Korean sources
        shell: bash
        run: |
          mapfile -t IDS < /tmp/child73-ko-ids.txt
          npm run public-domain:source-sync -- "${IDS[@]}" --prepare --limit=50 --delay-ms=750

      - name: Revalidate after source acquisition
        run: npm run public-domain:validate

      - name: Dry-run exact cohort
        shell: bash
        run: |
          mapfile -t IDS < /tmp/child73-ids.txt
          npm run public-domain:batch -- "${IDS[@]}" --max=100

      - name: Import exact cohort as Production Drafts
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "IMPORT_75_DRAFTS"
          mapfile -t IDS < /tmp/child73-ids.txt
          npm run public-domain:batch -- "${IDS[@]}" --max=100 --execute --target=production --production

      - name: Persist import audit state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-domain/manifests/*.json
          if git diff --cached --quiet; then
            echo "No manifest import-state changes"
          else
            git commit -m "Child73: record Production Draft imports"
            git push origin HEAD:main
          fi

      - name: Upload Draft-import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child73-production-draft-import
          path: |
            .public-domain-work/
            public-domain/manifests/
            public-domain/audits/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
