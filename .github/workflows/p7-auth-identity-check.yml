name: P7 auth identity and callback check

# Issue #142 (Google sign-in) PR1: provider real names must never become
# public display names, and /auth/callback failures use fixed localized codes.
# PR2: flag-gated "Continue with Google", callback branching to STEP 2,
# server-side write gate and official-account grant checks.
# PR3: server-recorded consent (app_metadata + account_consents), RLS
# migration source checks, word-explanation guidance in every locale.
# PR3b: identity-bound RLS / illustrations storage migration source, the
# profile field gate and the inventory of every write API route (any route
# under src/app/api must be gated or carry a stated exemption).
on:
  pull_request:
    paths:
      - ".github/workflows/p7-auth-identity-check.yml"
      - "src/app/auth/callback/**"
      - "src/app/login/**"
      - "src/app/mypage/page.tsx"
      - "src/app/register/**"
      - "src/app/record/create/**"
      - "src/app/api/account/**"
      - "src/app/api/recordings/human-publish/**"
      - "src/app/api/recordings/human-upload-finalize/**"
      - "src/features/comment/**"
      - "src/features/review/**"
      - "src/i18n/dictionaries/auth.ts"
      - "src/i18n/dictionaries/account.ts"
      - "src/i18n/dictionaries/episodeComments.ts"
      - "src/i18n/dictionaries/registrationGate.ts"
      - "src/features/write/**"
      - "src/features/translation/**"
      - "src/features/playback/**"
      - "supabase/migrations/20261115120000_issue142_google_consent_rls.sql"
      - "supabase/migrations/20261115180000_issue142_pr3b_identity_bound_consent.sql"
      - "scripts/issue142-google-consent/**"
      - "src/app/api/**"
      - ".github/workflows/issue142-google-consent-rls.yml"
      - "src/features/library/PrivateLibraryBilingualPlayback.tsx"
      - "src/lib/auth/**"
      - "src/components/auth/**"
      - "src/app/actions/**"
      - "src/app/api/recordings/**"
      - "src/app/api/episode-translations/**"
      - "src/app/api/library/translations/**"
      - "src/app/api/human-translations/**"
      - "src/app/api/word-explanations/**"
      - "src/app/write/series/**"
      - "src/app/subscription/**"
      - "src/lib/translation/**"
      - "src/lib/library/privateLibraryTranslationServer.ts"
      - "scripts/test-auth-identity-callback.ts"
      - "scripts/test-auth-google-registration.ts"
      - "scripts/test-auth-login-redirect.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Auth identity and callback error regression
        run: npm run test:auth-identity-callback
      - name: Google sign-in registration gate regression
        run: npm run test:auth-google-registration
      - name: Auth redirect regression
        run: npm run test:auth-login-redirect
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: >-
          npx eslint
          scripts/test-auth-identity-callback.ts
          scripts/test-auth-google-registration.ts
          src/lib/auth/registrationGate.ts
          src/lib/auth/registrationGate.server.ts
          src/lib/auth/googleConsent.ts
          src/app/api/account/google-consent/route.ts
          src/features/playback/useBilingualWordExplanation.ts
          src/lib/auth/registrationGateMessage.ts
          src/i18n/dictionaries/registrationGate.ts
          src/lib/auth/googleSignInFlag.ts
          src/lib/auth/officialAccount.ts
          src/lib/auth/officialNarrationAccount.ts
          src/lib/auth/officialAccount.server.ts
          src/components/auth/GoogleSignInButton.tsx
          src/app/actions/createOwnedSeries.ts
          src/app/actions/saveOwnedEpisode.ts
          src/app/actions/saveOwnedSeriesWorkspace.ts
          src/app/api/recordings/human-upload-session/route.ts
          src/app/api/library/translations/generate/route.ts
          src/app/api/human-translations/draft/route.ts
          "src/app/api/human-translations/[translationId]/publish/route.ts"
          "src/app/api/human-translations/[translationId]/route.ts"
          src/app/api/word-explanations/route.ts
          src/lib/translation/prepareEpisodeTranslationGeneration.ts
          src/lib/translation/episodeTranslationServer.ts
          src/lib/library/privateLibraryTranslationServer.ts
          src/lib/auth/authCallbackError.ts
          src/lib/auth/selfChosenDisplayName.ts
          src/app/auth/callback/route.ts
          src/app/login/LoginPageClient.tsx
          src/app/api/account/content-preferences/route.ts
          src/app/api/recordings/human-publish/route.ts
          src/app/api/recordings/human-upload-finalize/route.ts
          src/app/api/account/profile/route.ts
          src/app/api/authors/follow/route.ts
          src/app/api/authors/like/route.ts
          src/app/api/readers/like/route.ts
          src/app/api/series/reaction/route.ts
          src/app/api/bookmarks/series/route.ts
          "src/app/api/series/[seriesId]/content-rating/route.ts"
          "src/app/api/series/[seriesId]/source-language/route.ts"
          "src/app/api/series/[seriesId]/translation-permission/route.ts"
          "src/app/api/series/[seriesId]/human-translation-permission/route.ts"
          src/app/api/recordings/human-visibility/route.ts
          src/app/mypage/page.tsx
          "src/app/record/create/[seriesId]/page.tsx"
          src/features/comment/EpisodeCommentSection.tsx
          src/features/review/SeriesReviewSection.tsx
          src/i18n/dictionaries/auth.ts
      - name: Next build (offline synthetic public configuration)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-non-production-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-only-no-privileges-placeholder
        run: npm run build
