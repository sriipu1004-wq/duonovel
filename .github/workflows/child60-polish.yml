name: Apply Child60 polish

on:
  push:
    branches:
      - feat/multilingual-work-reader

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multilingual-work-reader
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/child60_polish_patch.py')
          s = p.read_text()
          old = '''text = read(path)
          if text.count(old_publish) != 2:
              raise SystemExit(f"expected 2 publish translation blocks, got {text.count(old_publish)}")
          write(path, text.replace(old_publish, new_publish))'''
          new = '''text = read(path)
          old_publish_2 = "\\n".join(line[2:] if line.startswith("  ") else line for line in old_publish.splitlines())
          new_publish_2 = "\\n".join(line[2:] if line.startswith("  ") else line for line in new_publish.splitlines())
          matches = text.count(old_publish) + text.count(old_publish_2)
          if matches != 2:
              raise SystemExit(f"expected 2 publish translation blocks, got {matches}")
          write(path, text.replace(old_publish, new_publish).replace(old_publish_2, new_publish_2))'''
          if old not in s:
              raise SystemExit('publish patch guard not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Apply patch
        run: python scripts/child60_polish_patch.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Multilingual regression
        run: npm run test:multilingual-work-reader
      - name: Lint touched files
        run: >-
          npx eslint
          src/app/generate/TimeFitStoryGeneratorClient.tsx
          src/app/api/time-fit-stories/generate/route.ts
          src/app/api/time-fit-stories/save-private/route.ts
          src/app/api/time-fit-stories/publish/route.ts
          'src/app/read/generated/[storyId]/GeneratedStoryReaderClient.tsx'
          src/features/playback/TranslationOnlyEpisodePlayback.tsx
          src/features/playback/TranslationOnlyFooter.tsx
          src/features/playback/BilingualSettingsBridge.tsx
          src/features/playback/ReadBilingualShell.tsx
          src/features/playback/WebSpeechEpisodePlayback.tsx
          src/features/playback/BilingualPane.tsx
          src/features/generation/PromptTagSuggestions.tsx
          src/i18n/dictionaries/reader.ts
          src/i18n/dictionaries/generate.ts
          src/lib/playback/translationReaderPreference.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "fix: polish multilingual reader and AI story locale"
          git push origin HEAD:feat/multilingual-work-reader
