name: Temporary SEO lint validation

on:
  push:
    branches:
      - feat/search-discovery-pages

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint SEO changes
        run: >-
          npx eslint
          src/components/seo/SearchLandingPage.tsx
          src/app/english-novel-reader/page.tsx
          src/app/web-novel-language-learning/page.tsx
          src/app/pdf-bilingual-reader/page.tsx
          src/app/sitemap.ts
          src/components/layout/AppFooter.tsx
