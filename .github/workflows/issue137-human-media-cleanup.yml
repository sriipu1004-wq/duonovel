# Issue #137 S2-1: apply H1 + the Human media-cleanup record migration to a
# disposable PostgreSQL 17 and assert owner-prefix validation, privileges,
# the retry receipt rules and rollback.
# Disposable PostgreSQL service container only; no Supabase hosted access.
name: Issue137 S2-1 human media cleanup
on:
  pull_request:
    paths:
      - ".github/workflows/issue137-human-media-cleanup.yml"
      - "scripts/issue137-human-media-cleanup/**"
      - "supabase/migrations/20261114120000_issue137_h1_human_atomic.sql"
      - "supabase/migrations/20261114140000_issue137_human_media_cleanup_pending.sql"
permissions:
  contents: read
jobs:
  human-media-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply migration to disposable DB and assert
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/issue137-human-media-cleanup/check.sql
