name: Child73 EN-KO parity source acquisition
# Diagnostic retrigger after Production Draft import run #1 failed

on:
  pull_request:
    paths:
      - ".github/workflows/child73-parity-source-acquisition.yml"
      - "public-domain/batches/en-ko-parity-2026-09-23.json"
      - "public-domain/manifests/**"
      - "scripts/public-domain/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child73-parity-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate 75 pending manifests
        run: npx tsx scripts/public-domain/generate-parity-manifests.ts

      - name: Validate generated pending manifests
        run: npm run public-domain:validate

      - name: Check whether parity cohort still needs acquisition
        id: cohort
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const batch = require("./public-domain/batches/en-ko-parity-2026-09-23.json");
          let needsAcquisition = false;
          for (const entry of batch.works) {
            const id = entry.provider === "gutenberg"
              ? "gutenberg-" + String(entry.provider_id).padStart(6, "0")
              : "gongu-" + entry.provider_id;
            const manifest = JSON.parse(
              fs.readFileSync(
                path.join("public-domain", "manifests", id + ".json"),
                "utf8"
              )
            );
            if (
              manifest.rights_status !== "approved" ||
              manifest.approved !== true ||
              manifest.import_status !== "imported"
            ) {
              needsAcquisition = true;
              break;
            }
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            "needs_acquisition=" + String(needsAcquisition) + "\n"
          );
          console.log(
            needsAcquisition
              ? "Parity cohort still has non-imported works; acquisition is required."
              : "Parity cohort is already fully approved and imported; acquisition is skipped."
          );
          NODE

      - name: Acquire and prepare English sources
        if: steps.cohort.outputs.needs_acquisition == 'true'
        shell: bash
        run: |
          mapfile -t IDS < <(
            node - <<'NODE'
          const batch = require("./public-domain/batches/en-ko-parity-2026-09-23.json");
          for (const entry of batch.works.filter((item) => item.provider === "gutenberg")) {
            console.log("gutenberg-" + String(entry.provider_id).padStart(6, "0"));
          }
          NODE
          )
          npm run public-domain:source-sync -- "${IDS[@]}" --prepare --limit=50 --delay-ms=750

      - name: Acquire and prepare Korean sources
        if: steps.cohort.outputs.needs_acquisition == 'true'
        shell: bash
        run: |
          mapfile -t IDS < <(
            node - <<'NODE'
          const batch = require("./public-domain/batches/en-ko-parity-2026-09-23.json");
          for (const entry of batch.works.filter((item) => item.provider === "gongu")) {
            console.log("gongu-" + entry.provider_id);
          }
          NODE
          )
          npm run public-domain:source-sync -- "${IDS[@]}" --prepare --limit=50 --delay-ms=750

      - name: Verify prepared cohort
        if: steps.cohort.outputs.needs_acquisition == 'true'
        run: npx tsx scripts/public-domain/report-parity-preflight.ts

      - name: Validate prepared manifests
        if: steps.cohort.outputs.needs_acquisition == 'true'
        run: npm run public-domain:validate

      - name: Persist source provenance and preflight report
        if: steps.cohort.outputs.needs_acquisition == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-domain/manifests/*.json public-domain/audits/en-ko-parity-preflight-2026-09-23.json
          if git diff --cached --quiet; then
            echo "No provenance changes to persist"
          else
            git commit -m "Child73: persist EN-KO source provenance"
            git pull --rebase origin "${GITHUB_HEAD_REF}"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload prepared evidence
        if: steps.cohort.outputs.needs_acquisition == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: child73-en-ko-parity-prepared
          path: |
            .public-domain-work/
            public-domain/audits/en-ko-parity-preflight-2026-09-23.json
            public-domain/manifests/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
