name: Child77 validation

on:
  push:
    branches:
      - audit/legacy-official-rights-provenance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: child77-validation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Validate manifests
        run: npm run public-domain:validate

      - name: Child77 audit invariants
        run: npm run test:legacy-official-rights-audit

      - name: Public Domain ingestion regression
        run: npm run test:public-domain-ingestion

      - name: Translation permission regression
        run: npm run test:series-translation-permission-schema

      - name: Public classic translation regression
        run: npm run test:public-classic-translation

      - name: Search language regression
        run: npm run test:public-search-language-filters

      - name: Human recording regressions
        run: |
          npm run test:human-recording-state
          npm run test:human-recording-boundaries

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-scope ESLint
        run: >
          npx eslint
          scripts/public-domain/legacy-provenance-audit.ts
          scripts/public-domain/migrate-legacy-approved.ts
          scripts/test-legacy-official-rights-audit.ts

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check 81edc154562b0ce0510320efcfcb3bf73e1a59ff...HEAD
