name: Child79 AI data-use checks

on:
  pull_request:
    paths:
      - ".github/workflows/child79-ai-data-use-check.yml"
      - "docs/ai-data-flow.md"
      - "scripts/test-author-ai-data-use.ts"
      - "scripts/test-ai-story-generation-removed.ts"
      - "src/app/api/word-explanations/**"
      - "src/app/api/time-fit-stories/**"
      - "src/app/generate/**"
      - "src/app/read/generated/**"
      - "src/features/generation/**"
      - "src/app/privacy/**"
      - "src/app/faq/**"
      - "src/features/write/TranslationPermissionWorkspaceBridge.tsx"
      - "src/lib/translation/openAITranslation.ts"
      - "src/lib/translation/publicEpisodeTranslation.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Child79 regression
        run: |
          node --import tsx scripts/test-author-ai-data-use.ts
          node --import tsx scripts/test-ai-story-generation-removed.ts

      - name: Existing translation and permission regressions
        run: |
          npm run test:series-translation-permission-schema
          npm run test:translation-consistency
          npm run test:public-classic-translation
          npm run test:translation-credit-runtime

      - name: Existing security and workspace regressions
        run: |
          npm run test:security-authz
          npm run test:workspace-schema-queries
          npm run test:author-workspace-ux

      - name: Existing reader and narration-boundary regressions
        run: |
          npm run test:reader-mode-unification
          npm run test:human-recording-boundaries

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Changed-scope ESLint
        run: >
          npx eslint
          scripts/test-author-ai-data-use.ts
          scripts/test-ai-story-generation-removed.ts
          src/app/api/word-explanations/route.ts
          src/app/privacy/page.tsx
          src/app/faq/page.tsx
          src/features/write/TranslationPermissionWorkspaceBridge.tsx
          src/lib/translation/openAITranslation.ts
          src/lib/translation/publicEpisodeTranslation.ts

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
