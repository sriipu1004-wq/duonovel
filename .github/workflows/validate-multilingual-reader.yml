name: Validate multilingual reader

on:
  push:
    branches:
      - feat/multilingual-work-reader
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: sk-ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Multilingual reader regression test
        run: npm run test:multilingual-work-reader

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint changed application files
        shell: bash
        run: |
          git fetch origin main --quiet
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx')
          printf 'Linting %s changed application files\n' "${#files[@]}"
          if ((${#files[@]})); then
            npx eslint "${files[@]}"
          fi

      - name: Full repository ESLint diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          exit ${PIPESTATUS[0]}

      - name: Upload ESLint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-reader-lint-log
          path: lint.log
          if-no-files-found: ignore

      - name: Next.js build diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-reader-build-log
          path: build.log
          if-no-files-found: ignore
