name: Validate multilingual reader

on:
  push:
    branches:
      - feat/multilingual-work-reader
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: sk-ci-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Multilingual reader regression test
        run: npm run test:multilingual-work-reader

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload ESLint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-reader-lint-log
          path: lint.log
          if-no-files-found: ignore

      - name: Next.js build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-reader-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Fail on validation errors
        if: steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "ESLint exit: ${{ steps.lint.outputs.exit_code }}"
          echo "Build exit: ${{ steps.build.outputs.exit_code }}"
          exit 1
