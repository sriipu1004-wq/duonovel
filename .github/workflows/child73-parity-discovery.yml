name: Child73 parity discovery

on:
  pull_request:
    paths:
      - "scripts/public-domain/discover-gongu-parity.ts"
      - ".github/workflows/child73-parity-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Discover conservative Gongu candidates
        run: npx tsx scripts/public-domain/discover-gongu-parity.ts
      - name: Persist discovery snapshot
        shell: bash
        run: |
          if git diff --quiet -- public-domain/audits/child73-gongu-discovered.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-domain/audits/child73-gongu-discovered.json
          git commit -m "Child73: persist Gongu candidate discovery"
          git push
