name: Security regression validation

on:
  push:
    branches:
      - security/auth-rls-payment-audit

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[security-validate]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev
      - name: Auth redirect regression
        run: npm run test:auth-login-redirect
      - name: Stripe credit webhook regression
        run: npm run test:stripe-credit-webhook
      - name: Public schema query regression
        run: npm run test:public-schema-queries
      - name: Workspace schema query regression
        run: npm run test:workspace-schema-queries
      - name: Translation permission schema regression
        run: npm run test:series-translation-permission-schema
      - name: Public search language regression
        run: npm run test:public-search-language-filters
      - name: Billing locale routing regression
        run: npm run test:billing-locale-routing
      - name: Security diff lint
        run: >-
          npx eslint
          scripts/test-auth-login-redirect.ts
          scripts/test-stripe-credit-webhook.ts
          src/app/api/account/display-name/check/route.ts
          src/app/api/account/email/check/route.ts
          src/app/api/account/email/prepare-signup/route.ts
          src/app/api/authors/follow/route.ts
          src/app/api/authors/like/route.ts
          src/app/api/billing/webhook/route.ts
          src/app/api/bookmarks/series/route.ts
          src/app/api/popularity/events/route.ts
          src/app/api/recordings/human-publish/route.ts
          src/app/api/recordings/human-upload-session/route.ts
          src/app/api/recordings/human-visibility/route.ts
          src/app/api/recordings/upload-check/route.ts
          src/app/api/series/reaction/route.ts
          src/lib/aiUsage/aiUsage.server.ts
          src/lib/auth/accountSignupConsent.ts
          src/lib/auth/displayNameAvailability.ts
          src/lib/billing/billing.server.ts
          src/lib/supabase/admin.ts
      - name: Repository lint baseline
        continue-on-error: true
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: npm run build
